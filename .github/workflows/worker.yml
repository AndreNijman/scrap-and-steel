name: Deploy Relay Worker
on:
  push:
    branches: [main]
    paths: ["worker/**", "wrangler.jsonc", ".github/workflows/worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: |
          sleep 5
          curl -fsS https://relay.scrap.andrenijman.com/health
          echo
          curl -fsS https://relay.scrap.andrenijman.com/lobbies
