name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # secret scan: reject credential-looking patterns and any special.special reference
      - name: Secret scan
        run: |
          ! grep -rInE "special\.special|CLOUDFLARE_API_TOKEN\s*=\s*['\"]?[A-Za-z0-9_-]{20,}|cfat [A-Za-z0-9_-]{20,}" src/ shared/ worker/ tools/ docs/ *.json *.ts 2>/dev/null
      # prose gate: no AI writing patterns in shipped text (titles, meta, docs)
      - name: Prose check (stop-slop)
        run: |
          python3 tools/slopcheck.py --allow-file .slopcheck-allow index.html README.md AGENTS.md docs/*.md
          python3 tools/slopcheck.py --allow-file .slopcheck-allow src/game/tutorial.ts || true
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke.mjs
