<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrap and Steel — build it, wire it, fight it</title>
  <meta name="description" content="Physics-based robot building sandbox and 1v1 arena fighter." />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- MENU -->
  <div id="screen-menu" class="screen">
    <div class="menu-box">
      <h1>SCRAP <span class="amp">&amp;</span> STEEL</h1>
      <p class="tagline">Build it. Wire it. Bind it. Fight it.</p>
      <div class="menu-buttons">
        <button id="btn-solo" class="big">Solo vs AI</button>
        <button id="btn-online" class="big">Online 1v1</button>
        <button id="btn-join" class="big secondary">Join by Code…</button>
        <button id="btn-help" class="small">How to play</button>
      </div>
      <div id="relay-status" class="relay-status">relay: checking…</div>
      <div class="versions"><span id="ver-text"></span></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen hidden">
    <div class="lobby-box">
      <div class="lobby-head">
        <button id="btn-leave-lobby" class="small">← Leave</button>
        <h2>Room <span id="lobby-code" class="code">—</span></h2>
        <button id="btn-copy-code" class="small">Copy code</button>
      </div>
      <div class="lobby-players">
        <div class="player" id="lobby-p0"></div>
        <div class="vs">VS</div>
        <div class="player" id="lobby-p1"></div>
      </div>
      <div id="lobby-settings"></div>
      <div class="lobby-actions">
        <button id="btn-ready" class="big">Ready</button>
        <div id="lobby-hint" class="hint"></div>
      </div>
    </div>
  </div>

  <!-- BUILD -->
  <div id="screen-build" class="screen hidden">
    <div id="build-topbar">
      <div class="tb-left">
        <span id="bp-name" contenteditable="true" spellcheck="false">My Robot</span>
      </div>
      <div class="tb-center">
        <span id="build-timer" class="timer">--:--</span>
        <span id="build-budget" class="pill">SP 0/1000</span>
        <span id="build-mass" class="pill">0 kg</span>
        <span id="build-parts" class="pill">0/120 parts</span>
      </div>
      <div class="tb-right">
        <button id="btn-undo" class="small" title="Undo (Ctrl+Z)">↶</button>
        <button id="btn-redo" class="small" title="Redo (Ctrl+Y)">↷</button>
        <button id="btn-test" class="small accent">▶ Test</button>
        <button id="btn-lock" class="big accent">LOCK IN</button>
        <button id="btn-leave-build" class="small">Leave</button>
      </div>
    </div>

    <div id="parts-bin">
      <div id="bin-tabs"></div>
      <div id="bin-items"></div>
    </div>

    <div id="inspector">
      <h3 id="insp-title">Inspector</h3>
      <div id="insp-body">Select a part…</div>
    </div>

    <div id="controls-panel">
      <h3>Controls</h3>
      <div id="controls-body"></div>
      <div class="hint">W/S throttle · A/D steer · Space fire · Shift lift (remappable)</div>
    </div>

    <div id="preflight" class="hidden"></div>
    <div id="build-msg" class="hidden"></div>
    <div id="countdown" class="hidden"></div>
  </div>

  <!-- COMBAT HUD -->
  <div id="screen-combat" class="screen hidden">
    <div id="combat-topbar">
      <div class="robot-status" id="status-p0"></div>
      <div id="combat-timer" class="timer big">--:--</div>
      <div class="robot-status right" id="status-p1"></div>
    </div>
    <div id="debug-overlay" class="hidden"></div>
    <div id="result-overlay" class="hidden">
      <div class="result-box">
        <h2 id="result-title">—</h2>
        <p id="result-reason"></p>
        <div class="menu-buttons">
          <button id="btn-rematch" class="big">Rematch</button>
          <button id="btn-result-menu" class="big secondary">Menu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HELP / JOIN MODALS -->
  <div id="modal" class="hidden">
    <div class="modal-box" id="modal-content"></div>
  </div>

  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
